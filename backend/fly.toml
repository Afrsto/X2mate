# fly.toml app configuration file generated for x2mate-api
app = 'x2mate-api'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 10000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '10s'
    grace_period = '60s'
    method = 'GET'
    path = '/api/status'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
